[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voice_out_translator"
version = "0.1.3"
description = "Translate and transcribe the audio output voice."
readme = "README.md"
authors = [{name = "Fernando Pujaico Rivera", email = "fernando.pujaico.rivera@gmail.com"}]
maintainers = [{name = "Fernando Pujaico Rivera", email = "fernando.pujaico.rivera@gmail.com"}]
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "GPL-3.0-only WITH Classpath-Exception-2.0 OR BSD-3-Clause"
license-files = ["LICENSE"]
keywords = ["stt", "translate"]
dependencies = [
    "PyQt5",
    "deep-consultation",
    "numpy",
    "sounddevice",
    "pydub"
]

[project.urls]
"Bug Reports" = "https://github.com/trucomanx-voice/VoiceOutTranslator/issues"
"Funding" = "https://trucomanx.github.io/en/funding.html"
"Documentation" = "https://github.com/trucomanx-voice/VoiceOutTranslator/tree/main/doc"
"Source" = "https://github.com/trucomanx-voice/VoiceOutTranslator"

[project.scripts]
"voice-out-translator" = "voice_out_translator.program:main"

[tool.setuptools]
packages = ["voice_out_translator", "voice_out_translator.audio", "voice_out_translator.external_lib", "voice_out_translator.modules", "voice_out_translator.ui", "voice_out_translator.utils", "voice_out_translator.workers"]

[tool.setuptools.package-data]
"voice_out_translator" = ["icons/logo.png"]
